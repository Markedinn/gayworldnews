<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Gay World News | Contact Us & Community Support</title>
		<meta name="description" content="Have questions or news tips? Get in touch with Gay World News. We are dedicated to providing safe, reliable LGBTQ+ travel and legal updates worldwide.">

		<link rel="canonical" href="https://www.gayworldnews.com/contact.html" />

		<meta property="og:title" content="Gay World News | Contact Our Team">
		<meta property="og:description" content="Reach out to GWN for inquiries, feedback, or support regarding LGBTQ+ global safety and news.">

		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:title" content="Gay World News | Contact Us">

		<link rel="apple-touch-icon" href="images/favicon.webp" />
		<link rel="stylesheet" href="index.css?v=1.8?v=1.6" />
		<style>
			
			
			.page-container {
				width: 92%;           /* Matches your mobile card width */
				max-width: 800px;     /* Matches your desktop card max-width */
				margin: auto auto 20px auto;       /* Centers the whole column */
				display: flex;
				flex-direction: column;
				align-items: center;
				flex: 0 1 auto;
			}	

			/* THE FROSTED GLASS RECTANGLE */
			.glass-mission-card {
				/* Less 'glass', more solid brand blue to match your map/footer */
				background: rgba(21, 139, 202, 0.8); 
				border: 2px solid rgba(255, 255, 255, 0.2);
				border-radius: 20px;
				padding: 40px;
				width: 100%;
				box-sizing: border-box;
				box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
				text-align: center;
				flex-shrink: 1;
				min-height: 400px;
			}

			.glass-mission-card h1, 
			.glass-mission-card p, 
			.form-group label {
				color: #ffffff !important;
			}

				.contact-form {
				display: flex;
				flex-direction: column;
				gap: 20px;
				margin-top: 30px;
			}

			.form-group {
				display: flex;
				flex-direction: column;
				gap: 8px;
				text-align: left;
			}

			.contact-form input,
			.contact-form textarea {
				/* Darker input background for better contrast */
				background: rgba(0, 0, 0, 0.2); 
				border: 1px solid rgba(255, 255, 255, 0.4);
				border-radius: 8px;
				padding: 12px;
				color: white;
				font-family: inherit;
				font-size: 1rem;
			}

			/* THE PLACEHOLDER FIX - Makes them readable */
			.contact-form input::placeholder,
			.contact-form textarea::placeholder {
				color: rgba(255, 255, 255, 0.7); /* Brighter, clearer text */
				font-style: italic;
			}

			.submit-btn {
				background: #24408e; /* Your dark blue */
				color: white;
				padding: 15px;
				border: none;
				border-radius: 8px;
				font-weight: 800;
				cursor: pointer;
				transition: 0.3s;
			}

			.submit-btn:hover {
				background: #ff4b2b; /* Change to Red on hover for that pop */
				transform: translateY(-2px);
			}
			.privacy-note {
			display: flex;
			align-items: center; /* This vertically centers the lock with the text */
			justify-content: center; /* Keeps the whole note centered in the card */
			gap: 8px; /* Modern way to handle the space instead of margin-right */
			font-size: 0.85rem;
			color: rgba(255, 255, 255, 0.6);
		}

			.lock-icon {
			line-height: 1;				
			font-size: 0.9rem;
		}

			/* Add this to your main CSS for single-column pages */
			.centered-utility-wrap {
    		width: 100%;
			max-width: 500px;
    		display: flex;
    		justify-content: center;
    		margin: 20px 0 20px 0; 
		}

		@media (min-width: 601px) and (max-width: 1024px) {
    
    
    .centered-utility-wrap {
        margin-bottom: 40px !important; /* Adds space between Translator and the Glass Card */
    }
}

		@media (max-width: 600px) {
    .glass-mission-card {
        /* Reduce padding so there's more room for text on small screens */
        padding: 25px 20px; 
        margin: 0 auto 20px auto; 
        border-radius: 15px; 
    }

    .contact-form {
        gap: 15px; /* Tighten the gap for shorter screens */
    }

    .submit-btn {
        padding: 12px; /* Slightly smaller button for thumbs */
    }

	.glass-mission-card {
        padding: 25px 20px;
    }
    .centered-utility-wrap {
        margin-top: 40px; /* Space for the Quick Exit button on mobile */
    }
	
}

.page-container {
    width: 92%;
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* This calculates exactly how much room is left for the card */
    /* 100vh - (Header space + Footer space) */
    min-height: calc(100vh - 250px); 
    justify-content: center;
}

.glass-mission-card {
    background: rgba(21, 139, 202, 0.8);
    padding: 20px 20px; /* Reduced top/bottom padding to save space */
    width: 100%;
    box-sizing: border-box;
    
    /* THE SHRINK COMMANDS */
    flex-shrink: 1; 
    max-height: 70vh; /* Limits card to 60% of laptop height */
    overflow-y: auto; /* Adds a scrollbar INSIDE the card if it gets too small */
}

.contact-form {
    gap: 10px; /* Tightens the gap between inputs significantly */
}

textarea {
    max-height: 100px; /* Prevents the message box from growing too tall on laptops */
}
		</style>
	</head>
	<body class="contact-page"> 

    <a href="https://www.google.com" class="exit-btn">QUICK EXIT</a>

    <div class="page-container">
	<div class="centered-utility-wrap">
    <div id="translator-anchor">
        <div id="google_translate_element"></div> 
		</div> 
	</div>
		
    <div class="glass-mission-card">
	<h1 class="main-title" style="margin-bottom: 20px">Write To Us</h1>
    <p>We'd love to hear from you.</p>

    <form action="mailto:info&#64;gayworldnews.com" method="GET" enctype="text/plain" class="contact-form">
        <div class="form-group">
            <label>Your Email</label>
            <input 
                type="email" 
                name="email" 
                placeholder="how-do-we-reply@email.com" 
                required 
            />
        </div>

        <div class="form-group">
            <label>Message</label>
            <textarea 
                name="body" 
                rows="5" 
                placeholder="Share your thoughts with us..." 
                required
            ></textarea>
        </div>

        <button type="submit" class="submit-btn">SEND MESSAGE</button>
        
        <div class="privacy-note" style="color: #ffffff;">
            <span class="lock-icon">🔒 </span>We will never share your data.
        </div>
    </form>
</div>
    </div>

    </body>

		<footer class="site-footer">
    <div class="footer-container">
		
		<div class="footer-card">
					<a href="index.html" class="home-btn-logo" title="Gay World News - Home">
						<span class="gwn-logo">GWN</span>
					</a>
				</div>
				
        <div class="footer-card">
            <a href="about.html" class="social-pill neutral" aria-label="Learn more about Gay World News"> 
                <i class="fas fa-info-circle"></i> <span>About</span> 
            </a>
        </div>

        <div class="footer-card">
            <a href="https://www.facebook.com/GayWorldNewsOrg/" target="_blank" rel="noopener" class="social-pill facebook" aria-label="Follow Gay World News on Facebook">
                <i class="fab fa-facebook-f"></i> <span>Facebook</span>
            </a>
        </div>

        <div class="footer-card">
            <a href="https://x.com/GayWorldNewsOrg" target="_blank" rel="noopener" class="social-pill x-twitter" aria-label="Follow Gay World News on X">

            </a>
        </div>

        <div class="footer-card">
            <a href="https://www.youtube.com/@GayWorldNewsOrg" target="_blank" rel="noopener" class="social-pill youtube" aria-label="Follow Gay World News on YouTube"> 
                <i class="fab fa-youtube"></i> <span>YouTube</span> 
            </a>
        </div>        
    </div>
    <div class="footer-bottom-bar">
        <p class="footer-copyright">© 2026 Gay World News (GWN)</p>
    </div>
</footer>

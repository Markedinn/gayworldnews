		<style>
						

			/* THE FROSTED GLASS RECTANGLE */
			.glass-mission-card {
				/* Less 'glass', more solid brand blue to match your map/footer */
				background: rgb(21, 139, 202, 0.8); 
				border: 2px solid rgba(255, 255, 255, 0.2);
				border-radius: 20px;
				padding: 40px;
				max-width: 800px;
				margin: 60px auto;
				box-sizing: border-box;
				/* Clean shadow for depth */
				box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
				text-align: center;
			}

			.glass-mission-card h1, 
			.glass-mission-card p, 
			.form-group label {
				color: #ffffff !important;
			}

				.contact-form {
				display: flex;
				flex-direction: column;
				gap: 20px;
				margin-top: 30px;
			}

			.form-group {
				display: flex;
				flex-direction: column;
				gap: 8px;
				text-align: left;
			}

			.contact-form input,
			.contact-form textarea {
				/* Darker input background for better contrast */
				background: rgba(0, 0, 0, 0.2); 
				border: 1px solid rgba(255, 255, 255, 0.4);
				border-radius: 8px;
				padding: 12px;
				color: white;
				font-family: inherit;
				font-size: 1rem;
			}

			/* THE PLACEHOLDER FIX - Makes them readable */
			.contact-form input::placeholder,
			.contact-form textarea::placeholder {
				color: rgba(255, 255, 255, 0.7); /* Brighter, clearer text */
				font-style: italic;
			}

			.submit-btn {
				background: #24408e; /* Your dark blue */
				color: white;
				padding: 15px;
				border: none;
				border-radius: 8px;
				font-weight: 800;
				cursor: pointer;
				transition: 0.3s;
			}

			.submit-btn:hover {
				background: #ff4b2b; /* Change to Red on hover for that pop */
				transform: translateY(-2px);
			}
			.privacy-note {
				margin-top: 25px;
				padding-top: 15px;
				border-top: 1px solid rgba(255, 255, 255, 0.1); /* Subtle separator line */
				font-size: 0.85rem;
				line-height: 1.4;
				color: rgba(255, 255, 255, 0.6); /* Faded white for a 'whisper' look */
				text-align: center;
			}

			.privacy-note strong {
				color: rgba(255, 255, 255, 0.9); /* Slightly brighter to emphasize safety */
				display: block;
				margin-top: 5px;
				text-transform: uppercase;
				letter-spacing: 1px;
			}

			.lock-icon {
				margin-right: 5px;
				font-size: 0.9rem;
			}

			/* Add this to your main CSS for single-column pages */
			.centered-utility-wrap {
				display: flex;
				justify-content: center; /* Centers the pill horizontally */
				align-items: center;
				max-width: 100%;
				margin: 80px auto 20px auto;
				padding: 0 20px;
			}

			@media (max-width: 600px) {
    .glass-mission-card {
        /* Reduce padding so there's more room for text on small screens */
        padding: 25px 20px; 
        
        /* The Magic Move: 90% width keeps 5% 'air' on each side */
        width: 92%; 
        margin: 40px auto; 
        
        /* Ensure the border-radius doesn't look too 'aggressive' on small screens */
        border-radius: 15px; 
    }

    .contact-form {
        gap: 15px; /* Tighten the gap for shorter screens */
    }

    .submit-btn {
        padding: 12px; /* Slightly smaller button for thumbs */
    }
}
		</style>
	</head>
	<body class="contact-page"> 

    <a href="https://youtube.com" class="exit-btn">QUICK EXIT</a>
	<div class="centered-utility-wrap">
    <div id="translator-anchor" class="landing-pill-style">
        <div id="google_translate_element"></div> </div> </div>

    <div class="page-container">
        <div class="glass-mission-card">
    <h1 class="rainbow-text" style="margin-bottom: 20px">Get In Touch</h1>
    <p>We'd love to hear from you.</p>

    <form action="mailto:info&#64;gayworldnews.com" method="GET" enctype="text/plain" class="contact-form">
        <div class="form-group">
            <label>Your Email</label>
            <input 
                type="email" 
                name="email" 
                placeholder="how-do-we-reply@email.com" 
                required 
            />
        </div>

        <div class="form-group">
            <label>Message</label>
            <textarea 
                name="body" 
                rows="5" 
                placeholder="Share your thoughts with us..." 
                required
            ></textarea>
        </div>

        <button type="submit" class="submit-btn">SEND MESSAGE</button>
        
        <div class="privacy-note">
            <span class="lock-icon">🔒</span> We respect your privacy. Your email will never be shared or used for marketing.
            <strong>Safety is our priority.</strong>
        </div>
    </form>
</div>
    </div>

    </body>

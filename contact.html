		<style>
			/* THE MAP BACKGROUND */
			body.about-page {
				background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url("images/world-map.webp"); /* Replace with your map path */
				background-size: cover;
				background-attachment: fixed;
				background-position: center;
				display: flex;
				flex-direction: column;
				min-height: 100vh;
			}

			/* THE FROSTED GLASS RECTANGLE */
			.glass-mission-card {
				background: rgba(255, 255, 255, 0.08);
				backdrop-filter: blur(15px);
				-webkit-backdrop-filter: blur(15px);
				border: 1px solid rgba(255, 255, 255, 0.2);
				border-radius: 20px;
				padding: 40px;
				max-width: 800px;
				margin: 60px auto; /* Centered with margin auto */
				box-sizing: border-box; /* Your critical rule! */
				box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
								text-align: center;

			}

			.glass-mission-card p {
				line-height: 1.8;
				font-size: 1.1rem;
				color: white;
				margin-bottom: 20px;
			}

			.contact-form {
				display: flex;
				flex-direction: column;
				gap: 20px;
				margin-top: 30px;
			}

			.form-group {
				display: flex;
				flex-direction: column;
				gap: 8px;
				text-align: left;
			}

			.contact-form input,
			.contact-form textarea {
				background: rgba(255, 255, 255, 0.1);
				border: 1px solid rgba(255, 255, 255, 0.3);
				border-radius: 8px;
				padding: 12px;
				color: white;
				font-family: inherit;
			}

			.submit-btn {
				background: #24408e; /* Your dark blue */
				color: white;
				padding: 15px;
				border: none;
				border-radius: 8px;
				font-weight: 800;
				cursor: pointer;
				transition: 0.3s;
			}

			.submit-btn:hover {
				background: #ff4b2b; /* Change to Red on hover for that pop */
				transform: translateY(-2px);
			}
			.privacy-note {
				margin-top: 25px;
				padding-top: 15px;
				border-top: 1px solid rgba(255, 255, 255, 0.1); /* Subtle separator line */
				font-size: 0.85rem;
				line-height: 1.4;
				color: rgba(255, 255, 255, 0.6); /* Faded white for a 'whisper' look */
				text-align: center;
			}

			.privacy-note strong {
				color: rgba(255, 255, 255, 0.9); /* Slightly brighter to emphasize safety */
				display: block;
				margin-top: 5px;
				text-transform: uppercase;
				letter-spacing: 1px;
			}

			.lock-icon {
				margin-right: 5px;
				font-size: 0.9rem;
			}

			/* Add this to your main CSS for single-column pages */
.centered-utility-wrap {
    max-width: 400px; /* Adjust this to match your search bar width */
    margin: 80px auto 20px auto;
    width: 90%;
}

	<body class="contact-page"> 

    <a href="https://youtube.com" class="exit-btn">QUICK EXIT</a>
	<div class="centered-utility-wrap">
    <div id="translator-anchor" class="landing-pill-style">
        <div id="google_translate_element"></div> </div> </div>

    <div class="page-container">
        <div class="glass-mission-card">
    <h1 class="rainbow-text" style="margin-bottom: 20px">Get In Touch</h1>
    <p>We'd love to hear from you.</p>

    <form action="mailto:info&#64;gayworldnews.com" method="GET" enctype="text/plain" class="contact-form">
        <div class="form-group">
            <label>Your Email</label>
            <input 
                type="email" 
                name="email" 
                placeholder="how-do-we-reply@email.com" 
                required 
            />
        </div>

        <div class="form-group">
            <label>Message</label>
            <textarea 
                name="body" 
                rows="5" 
                placeholder="Share your thoughts with us..." 
                required
            ></textarea>
        </div>

        <button type="submit" class="submit-btn">SEND MESSAGE</button>
        
        <div class="privacy-note">
            <span class="lock-icon">🔒</span> We respect your privacy. Your email will never be shared or used for marketing.
            <strong>Safety is our priority.</strong>
        </div>
    </form>
</div>

			/* 1. THE MASTER LAYOUT - CENTERING LOGIC */
			body.contact-page {

				display: flex;
				flex-direction: column;

				margin-bottom: 5px;

				font-weight: 300;
				opacity: 1; /* Firefox fix: ensures the color isn't washed out */
			}

			.contact-form input,
			.contact-form textarea {
				width: 100%;
				background: rgba(37, 37, 37, 0.8);
				border: 1px solid rgb(255, 255, 255);
				border-radius: 8px;
				padding: 12px;
				color: #ffffff;
				font-weight: 500;
				box-sizing: border-box;
			}

			/* 3.5 THE BUTTON STYLING */

			.submit-btn {
				background: rgba(22, 7, 230, 0.3);
				color: white;
				padding: 15px;
				border: 2px solid rgb(255, 255, 255);
				border-radius: 8px;
				font-weight: 800;
				font-size: 1rem;
				cursor: pointer;
				transition: all 0.3s ease;
				margin-top: 10px;
				text-transform: uppercase;

			.submit-btn:hover {
				background: #ff3399 !important;
				transform: translateY(-2px);
				box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
				border-color: white;
			}

			.submit-btn:active {
				transform: translateY(0);
			}

			/* 3.5 THE BUTTON STYLING */

			.submit-btn:hover {
				background: #ff4b2b; /* The Red hover you liked */
				transform: translateY(-2px);
				box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
				border-color: white;
			}

			.submit-btn:active {
				transform: translateY(0);
			}

			.status-msg {
				padding: 15px;
				margin-bottom: 20px;
				border-radius: 10px;
				text-align: center;
				font-weight: 600;
				font-size: 0.9rem;
			}

			.success-msg {
				background: rgba(40, 167, 69, 0.2);
				color: #28a745;

			}

			.error-msg {
				background: rgba(220, 53, 69, 0.2);

			/* 4. THE FOOTER FIX */
			.site-footer {

			/* 5. THE LAPTOP & TABLET OPTIMIZATION (Vertical Space Saver) */

			/* 6. SMARTPHONE-ONLY PRECISION (Width-based) */

	<body class="contact-page">
		<a href="https://www.google.com" class="exit-btn" title="Exit this site immediately">QUICK EXIT</a>
		<div class="page-container">
			<div id="translator-anchor">
				<div id="google_translate_element"></div>
			</div>

			<div class="glass-mission-card">
				<h1 class="main-title" style="margin-bottom: 20px">Write To Us</h1>
				<p style="color: white; margin-bottom: 20px">Your opinion matters.</p>

				<div id="form-status-success" class="status-msg success-msg" style="display: none"><i class="fas fa-check-circle"></i> Message sent successfully!</div>

				<div id="form-status-error" class="status-msg error-msg" style="display: none"><i class="fas fa-exclamation-triangle"></i> Something went wrong. Please try again.</div>

				<form id="gwn-custom-form" action="send_mail.php" method="POST" class="contact-form">
					<div class="form-group">
						<label>Email</label>
						<input type="email" name="email" required placeholder="your@email.com" />
					</div>

					<div class="form-group">
						<label>Message</label>
						<textarea name="message" rows="4" required placeholder="Hi! I have an update for you..."></textarea>
					</div>

					<button type="submit" class="submit-btn">SEND MESSAGE</button>

					<div class="privacy-note" style="color: rgba(255, 255, 255, 0.7); font-size: 0.8rem; margin-top: 15px; text-align: center">🔒 We will never share your data.</div>
				</form>
			</div>
		</div>

		<script>
			window.gtranslateSettings = {
				default_language: "en",
				detect_browser_language: true,
				wrapper_selector: "#translator-anchor",
				type: "dropdown",
			};

			// This "forces" the text because the widget settings sometimes fail
			window.addEventListener("load", function () {
				setTimeout(function () {
					var select = document.querySelector("#translator-anchor select");
					if (select) {
						// Creates a new "Select Language" option at the very top
						var opt = document.createElement("option");
						opt.value = "";
						opt.innerHTML = "Select Language";
						opt.selected = true;
						opt.disabled = true;
						select.insertBefore(opt, select.firstChild);
					}
				}, 1000); // Waits 1 second for the widget to finish loading
			});
		</script>
		<script src="https://cdn.gtranslate.net/widgets/latest/dropdown.js" defer></script>
		<script>
			// Check the URL for ?success=1 or ?error=1
			const urlParams = new URLSearchParams(window.location.search);

			if (urlParams.has("success")) {
				document.getElementById("form-status-success").style.display = "block";
			} else if (urlParams.has("error")) {
				document.getElementById("form-status-error").style.display = "block";
			}
		</script>

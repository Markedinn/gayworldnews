			#legendContent {

			/* State for when legend is collapsed */

				display: none;

			#legendArrow {

				transition: transform 0.3s ease;

			.legend-collapsed #legendArrow {

			/* This hides the text content when the class is present */

			/* This rotates the arrow so it points 'closed' by default */

			}

			/* Remove the 'flashing' underline/focus ring on click */
			#legendHeader {

				-webkit-tap-highlight-color: transparent; /* Removes the blue flash on mobile tap */
			}

			/* For accessibility, we keep the outline only for keyboard users */
			#legendHeader:focus-visible {
				outline: 2px solid; /* Change arrow color to Pink */
			}
			#legendArrow {
				font-size: 14px;
				color: #ff3399; /* <--- Replace with your exact Pink hex code */
				transition: transform 0.3s ease;
				user-select: none; /* Prevents the arrow itself from being highlighted/selected */
			}

			/* Remove the 'flashing' underline/focus ring on click */
			#legendHeader {
				outline: none !important;
				-webkit-tap-highlight-color: transparent; /* Removes the blue flash on mobile tap */
			}

			/* For accessibility, we keep the outline only for keyboard users */

			}

			/* Ensure the legend can actually grow when opened */
			#legend:not(.legend-collapsed) #legendContent {

			/* --- UNIVERSAL FOOTER FIX --- */
			/* THE MISSING PIECE: The instructions for the movement */

	<body>
		<div id="legend" class="legend-collapsed">
			<div id="legendHeader" onclick="toggleLegend()">
				<h3 style="margin: 0; font-size: 16px; color: #333">LGBT Risk Advisory</h3>
				<span id="legendArrow">▼</span>
			</div>
			<div id="legendContent">
				<div class="legend-item">
					<div class="color-box" style="background: #22c55e"></div>
					<strong>Green:&nbsp;</strong> Safe / Normal
				</div>
				<div class="legend-item">
					<div class="color-box" style="background: #eab308"></div>
					<strong>Yellow:&nbsp;</strong> Caution Required
				</div>
				<div class="legend-item">
					<div class="color-box" style="background: #ef4444"></div>
					<strong>Red:&nbsp;</strong> Danger / Persecution
				</div>
				<div class="legend-item">
					<div class="color-box" style="background: #a5dff9"></div>
					<strong>Ice:&nbsp;</strong> International Territory
				</div>
			</div>
		</div>

		<div id="map"></div>

		<footer class="site-footer">
			<div class="footer-container">
				<div class="footer-section">
					<a href="index.html" class="home-btn-logo">
						<span class="gwn-logo">GWN</span>
					</a>
				</div>

				<span class="footer-divider">|</span>

				<div class="footer-section">
					<span class="home-btn">TAP COUNTRY TO OPEN</span>
				</div>
			</div>
		</footer>

		<script>
			const map = L.map("map", {
				zoomSnap: 0.1,
				attributionControl: false,
				zoomControl: false, // This line hides the +/- buttons
			}).setView([15, 0], 2);

			// 1. Check if data files loaded
			console.log("Data Status:", window.globalData ? "Loaded" : "Missing!");

			// 2. Fetch the world shapes
			fetch("https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson")
				.then((res) => {
					if (!res.ok) throw new Error("Network block! Are you running this locally?");
					return res.json();
				})
				.then((geo) => {
					L.geoJSON(geo, {
						style: function (feature) {
							// GeoJSON uses .ADMIN or .name. We check both.
							const rawName = feature.properties.ADMIN || feature.properties.name || "";
							const key = rawName.toLowerCase().replace(/\s+/g, "_").replace(/[^\w]/g, "");

							const country = window.globalData ? window.globalData[key] : null;
							let status = country ? country.status.toLowerCase() : "gray";

							let color = "#94a3b8"; // Default gray
							if (status === "green") color = "#22c55e";
							else if (status === "yellow") color = "#eab308";
							else if (status === "red" || status === "danger") color = "#ef4444";
							else if (status === "black") color = "#1a1a1a";
							else if (status === "ice" || status === "advisory") color = "#00e5ff";

							return {
								fillColor: color,
								// THE TRICK: Match the border to the sea (#1a2b56)
								// A darker blue border makes the map look high-end
								color: "rgb(15, 100, 150)",
								weight: 0.7,
								fillOpacity: 1.0, // Full opacity for the richest colors possible
							};
						},
						onEachFeature: (feature, layer) => {
							const rawName = feature.properties.ADMIN || feature.properties.name || "";
							const key = rawName.toLowerCase().replace(/\s+/g, "_").replace(/[^\w]/g, "");

							layer.on("click", () => {
								window.location.href = `country.html?c=${key}`;
							});
						},
					}).addTo(map);
				})
				.catch((err) => {
					console.error("MAP ERROR:", err);
					alert("The map couldn't load the country shapes. If you are testing this locally, please upload it to your web server first!");
				});
			function toggleLegend() {
				const legend = document.getElementById("legend");
				legend.classList.toggle("legend-collapsed");
			}
		</script>

		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				font-family: "Helvetica Neue", Arial, sans-serif;
			}

			#map {
				position: fixed !important; /* Changed from absolute to fixed */
				top: 0;
				left: 0;
				right: 0;
				bottom: 0;
				width: 100vw;
				height: 125vh !important;
				height: 125dvh !important;
				background: #1607e6; /* Match your deep blue */
				z-index: 1;
			}

			#hoverBox {
				position: absolute;
				background: white;
				padding: 8px 12px;
				border-radius: 6px;
				pointer-events: none;
				display: none;
				z-index: 10000;
				border: 1px solid #ccc;
				font-size: 14px;
			}

			#legend {
				position: absolute;
				top: 20px;
				left: 20px;
				background: rgba(255, 255, 255, 0.95);
				padding: 15px;
				border-radius: 8px;
				z-index: 9999;
				width: 240px;
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
			}

			.legend-item {
				display: flex;
				align-items: center;
				margin-bottom: 8px;
				font-size: 13px;
			}
			.color-box {
				width: 16px;
				height: 16px;
				margin-right: 10px;
				border-radius: 3px;
				border: 1px solid #666;
			}

			.leaflet-overlay-pane {
				z-index: 400 !important;
			}

			.leaflet-tile-container {
				/* Tells the mobile GPU: "Don't let go of these images!" */
				will-change: transform;
				pointer-events: none;
			}

			.leaflet-zoom-animated {
				/* Prevents the "white flash" when moving fast */
				backface-visibility: hidden;
			}

			/* LEGEND */

			#legend {
				position: absolute;
				top: 20px;
				left: 20px;
				background: rgba(255, 255, 255, 0.95);
				padding: 0; /* Changed to 0 so the header fills the space */
				border-radius: 8px;
				z-index: 9999;
				width: 240px;
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
				overflow: hidden; /* Clips the content when closed */
				transition: all 0.3s ease;
			}

			#legendHeader {
				padding: 12px 15px;
				background: #f8fafc;
				cursor: pointer;
				display: flex;
				justify-content: space-between;
				align-items: center;
				border-bottom: 1px solid #eee;
			}

			#legendHeader:hover {
				background: #f1f5f9;
			}

			#legendContent {
				padding: 15px;
				transition: max-height 0.3s ease;
			}

			/* State for when legend is collapsed */
			.legend-collapsed #legendContent {
				display: none;
			}

			/* This hides the text content when the class is present */
			.legend-collapsed #legendContent {
				display: none;
			}

			/* Change arrow color to Pink */
			#legendArrow {
				font-size: 14px;
				color: #ff3399; /* <--- Replace with your exact Pink hex code */
				transition: transform 0.3s ease;
				user-select: none; /* Prevents the arrow itself from being highlighted/selected */
			}

			#legendArrow {
				font-size: 14px;
				color: #ff3399; /* <--- Replace with your exact Pink hex code */
				transition: transform 0.3s ease;
				user-select: none; /* Prevents the arrow itself from being highlighted/selected */
			}

			/* Remove the 'flashing' underline/focus ring on click */
			#legendHeader {
				outline: none !important;
				-webkit-tap-highlight-color: transparent; /* Removes the blue flash on mobile tap */
			}

			/* For accessibility, we keep the outline only for keyboard users */
			#legendHeader:focus-visible {
				outline: 2px solid #ff3399;
			}

			/* Ensure the legend can actually grow when opened */
			#legend:not(.legend-collapsed) #legendContent {
				display: block;
				max-height: 500px; /* Or whatever height fits your content */
			}

			/* --- UNIVERSAL FOOTER FIX --- */
			.gwn-logo {
				position: relative;
				font-size: 2rem;
				font-weight: 700;
				text-transform: uppercase;
				display: inline-block;
				letter-spacing: -2.9px;
				line-height: 1;
				cursor: pointer;
				transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
				z-index: 1;
				padding-left: 0.4em;
				margin-left: -0.4em;
				background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.8) 50%, rgba(240, 240, 240, 0.9) 100%);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
				filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.5)) drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.2));
			}

			.gwn-logo::after {
				content: "";
				position: absolute;
				bottom: 1.8px;
				left: 0;
				width: calc(100% + 0.03em);
				height: 4px;
				background: linear-gradient(180deg, #ff3399 0%, #d62b82 100%);
				box-shadow:
					inset 0 -2px 0 rgba(0, 0, 0, 0.2),
					0 2px 4px rgba(0, 0, 0, 0.2);
				border-radius: 1px;
				z-index: -1;
			}

			.gwn-logo:hover {
				transform: translateY(-4px);
			}

			/* --- REDESIGNED FOOTER LAYOUT --- */
			.site-footer {
				position: fixed !important;
				bottom: 0 !important;
				left: 0;
				width: 100%;
				height: 60px;
				background: rgba(22, 7, 230, 0.79);
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				border-top: 2.5px solid rgba(255, 255, 255, 0.74);
				transition: all 0.3s ease;
			}

			.footer-container {
				display: grid !important;
				/* Two equal halves for content, 'auto' for the thin bar */
				grid-template-columns: 1fr auto 1fr !important;
				align-items: center !important;
				width: 100% !important;
			}

			/* Centering the content within each half */
			.footer-section {
				display: flex !important;
				justify-content: center !important;
				align-items: center !important;
			}

			/* The vertical bar styling */
			.footer-divider {
				color: rgba(255, 255, 255, 0.3);
				font-size: 20px;
				font-weight: 100;
				/* Ensures the space is no bigger than the character itself */
				padding: 0;
				margin: 0;
			}

			.home-btn {
				color: #ff3399;
				font-weight: 800;
				font-size: 12px;
				letter-spacing: 1px;
				text-align: center;
				/* cursor: pointer; */
			}

			.home-btn-logo {
				text-decoration: none;
			}

	<body>
		<div id="legend" class="legend-collapsed">
			<div id="legendHeader" onclick="toggleLegend()">
				<h3 style="margin: 0; font-size: 16px; color: #333">LGBT Risk Advisory</h3>
				<span id="legendArrow">▼</span>
			</div>
			<div id="legendContent">
				<div class="legend-item">
					<div class="color-box" style="background: #22c55e"></div>
					<strong>Green:&nbsp;</strong> Safe / Normal
				</div>
				<div class="legend-item">
					<div class="color-box" style="background: #eab308"></div>
					<strong>amber:&nbsp;</strong> Caution Required
				</div>
				<div class="legend-item">
					<div class="color-box" style="background: #ef4444"></div>
					<strong>Red:&nbsp;</strong> Danger / Persecution
				</div>
				<div class="legend-item">
					<div class="color-box" style="background: #00e5ff"></div>
					<strong>Ice:&nbsp;</strong> International Territory
				</div>
			</div>
		</div>

		<div id="map"></div>

		<footer class="site-footer">
			<div class="footer-container">
				<div class="footer-section">
					<a href="/" class="home-btn-logo" title="Gay World News - Home">
						<span class="gwn-logo">GWN</span>
					</a>
				</div>

				<span class="footer-divider">|</span>

				<div class="footer-section">
					<span class="home-btn">TAP COUNTRY TO OPEN</span>
				</div>
			</div>
		</footer>

		<script>
			// Prevents mobile browsers from "pulling down to refresh" while using the map
			document.body.addEventListener(
				"touchmove",
				function (e) {
					e.preventDefault();
				},
				{ passive: false },
			);
			const map = L.map("map", {
				renderer: L.canvas(), // <--- This makes the countries stay "drawn" in memory
				zoomSnap: 0.1,
				attributionControl: false,
				zoomControl: false,
				inertia: true, // Makes the "flick" feel smoother
				inertiaFraction: 0.5,
			}).setView([15, 0], 2);

			// 1. Check if data files loaded
			console.log("Data Status:", window.globalData ? "Loaded" : "Missing!");

			// 2. Fetch the world shapes
			fetch("world.geojson.txt")
				.then((res) => {
					if (!res.ok) throw new Error("File not found!");
					return res.json();
				})
				.then((geo) => {
					L.geoJSON(geo, {
						style: function (feature) {
							// GeoJSON uses .ADMIN or .name. We check both.
							const rawName = feature.properties.ADMIN || feature.properties.name || "";
							const key = rawName.toLowerCase().replace(/\s+/g, "_").replace(/[^\w]/g, "");

							const country = window.globalData ? window.globalData[key] : null;
							let status = country ? country.status.toLowerCase() : "gray";

							let color = "#94a3b8"; // Default gray
							if (status === "green") color = "#22c55e";
							else if (status === "amber") color = "#eab308";
							else if (status === "red" || status === "danger") color = "#ef4444";
							else if (status === "black") color = "#1a1a1a";
							else if (status === "ice" || status === "advisory") color = "#00e5ff";

							return {
								fillColor: color,
								// THE TRICK: Match the border to the sea (#1a2b56)
								// A darker blue border makes the map look high-end
								color: "rgb(15, 100, 150)",
								weight: 0.7,
								fillOpacity: 1.0, // Full opacity for the richest colors possible
							};
						},
						onEachFeature: (feature, layer) => {
							const rawName = feature.properties.ADMIN || feature.properties.name || "";
							const key = rawName.toLowerCase().replace(/\s+/g, "_").replace(/[^\w]/g, "");

							layer.on("click", () => {
								window.location.href = `country.html?c=${key}`;
							});
						},
					}).addTo(map);
				})
				.catch((err) => {
					console.error("MAP ERROR:", err);
					alert("The map couldn't load the country shapes. If you are testing this locally, please upload it to your web server first!");
				});
			function toggleLegend() {
				const legend = document.getElementById("legend");
				legend.classList.toggle("legend-collapsed");
			}
		</script>
	</body>
